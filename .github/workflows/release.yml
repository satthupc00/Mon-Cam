name: Build & Release (Windows)

on:
  push:
    paths:
      - package.json
      - src/whatsnew.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "MonCam-Setup-$V.exe"; then
            echo "Release v$V already has the installer, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: Release notes from whatsnew.json
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          node -e "
          const w=require('./src/whatsnew.json');const out=[];
          const sec=(k,t)=>{if(w[k]&&w[k].length){out.push('### '+t);w[k].forEach(x=>out.push('- '+x));out.push('');}};
          sec('new','Mới');sec('improved','Cải thiện');sec('fixed','Sửa lỗi');
          out.push('Tải **MonCam-Setup-'+w.version+'.exe** bên dưới để cài. Bản đã cài sẽ tự báo khi có bản mới.');
          require('fs').writeFileSync('build/release-notes.md',out.join('\n'));"

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish never

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          FILES="dist/MonCam-Setup-$V.exe dist/MonCam-Setup-$V.exe.blockmap dist/latest.yml"
          ls -la $FILES
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber
            gh release edit "v$V" --title "Mon Cam v$V" --notes-file build/release-notes.md --draft=false --latest
          else
            gh release create "v$V" $FILES --target "$GITHUB_SHA" --title "Mon Cam v$V" --notes-file build/release-notes.md --latest
          fi
