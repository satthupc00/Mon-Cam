<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Đang quay</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{background:transparent}
.bar{position:fixed;inset:0;display:flex;align-items:center;gap:6px;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 12px;-webkit-app-region:drag}
button{-webkit-app-region:no-drag}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s ease-in-out infinite;flex:0 0 auto}
.paused .dot{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.35}}
.timer{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:66px}
.paused .timer{color:var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.info{color:var(--muted);font-size:11.5px;padding:0 6px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pz{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pz:hover{border-color:var(--warn)}
.pz svg{width:14px;height:14px}
.paused .pz{background:rgba(242,184,75,.15);border-color:var(--warn);color:var(--warn)}
.stop{background:var(--red)!important;border-color:var(--red)!important;color:#fff}
.stop:hover{box-shadow:0 4px 12px rgba(229,56,59,.4)}
</style></head>
<body>
<div class="bar" id="bar">
  <span class="dot"></span><span class="timer" id="t">00:00:00</span>
  <span class="info" id="info"></span>
  <button class="pz" id="pz" title="Tạm dừng"></button>
  <button class="ibtn stop" id="stop" title="Dừng & lưu" data-i="stop"></button>
  <button class="ibtn" id="cancel" title="Huỷ bản quay" data-i="trash"></button>
</div>
<script src="icons.js"></script>
<script>
hydrateIcons();
const $ = id => document.getElementById(id);
const fmtT = ms => { const s = Math.floor(ms / 1000); return [s / 3600, s / 60 % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); };
const fmtB = b => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB';
let last = '';
function render(s) {
  const p = s.state === 'paused';
  $('bar').classList.toggle('paused', p);
  $('t').textContent = fmtT(s.ms || 0);
  $('info').textContent = `${s.fmt || ''} · ${s.fps || ''} fps · ${fmtB(s.bytes || 0)}${s.audio ? ' · có tiếng' : ''}`;
  const k = p ? 'p' : 'r';
  if (k !== last) {
    last = k;
    $('pz').innerHTML = p ? icon('play') + 'Tiếp tục' : icon('pause') + 'Tạm dừng';
    $('pz').title = p ? 'Tiếp tục quay' : 'Tạm dừng';
  }
}
render({ state: 'recording', ms: 0 });
api.on('rec:state', render);
$('pz').onclick = () => api.invoke('rec:pause');
$('stop').onclick = () => api.invoke('rec:stop');
$('cancel').onclick = () => { if (confirm('Huỷ bản quay này? Video sẽ không được lưu.')) api.invoke('rec:cancel'); };
</script>
</body></html>
