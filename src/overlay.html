<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Chọn vùng</title>
<link rel="stylesheet" href="base.css">
<style>
html,body{background:#000;cursor:crosshair}
#shot{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#dim{position:fixed;inset:0;pointer-events:none}
.sel{position:fixed;border:2px dashed var(--red);box-shadow:0 0 0 1px rgba(0,0,0,.4);display:none;cursor:move}
.sel .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--red);border-radius:2px}
.h.nw{left:-7px;top:-7px;cursor:nwse-resize}.h.ne{right:-7px;top:-7px;cursor:nesw-resize}
.h.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.h.n{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.h.s{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}
.h.w{left:-7px;top:calc(50% - 6px);cursor:ew-resize}.h.e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}
.tag{position:fixed;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:5px;font-variant-numeric:tabular-nums;display:none;pointer-events:none}
.bar{position:fixed;display:none;gap:6px;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 10px 24px rgba(0,0,0,.45);cursor:default;align-items:center;animation:barIn .25s var(--ease-out)}
@keyframes barIn{from{opacity:0;transform:translateY(6px)}}
.bar .div{width:1px;align-self:stretch;background:var(--line);margin:2px}
.bar .ibtn.on{background:var(--selected-bg);border-color:var(--red);color:#fff}
.bar .ibtn.off{color:var(--muted)}
.bar kbd{background:rgba(0,0,0,.2);border-color:rgba(0,0,0,.2);color:#fff}
.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(31,33,38,.92);border:1px solid var(--line);border-radius:8px;padding:8px 14px;white-space:nowrap;pointer-events:none;transition:opacity .2s}
.loupe{position:fixed;width:120px;height:120px;border-radius:8px;border:2px solid #fff;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;display:none;background:#000}
.loupe canvas{display:block}
.loupe span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:10.5px;text-align:center;font-variant-numeric:tabular-nums}
#ann{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.sel.drawing{pointer-events:none}
.sel.drawing .h{pointer-events:auto}
body.tool-on{cursor:crosshair}
body.tool-text{cursor:text}
.tool{width:32px;height:32px;border-radius:6px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;color:var(--text);padding:0}
.tool svg{width:16px;height:16px}
.tool:hover{border-color:var(--red);transform:translateY(-1px)}
.tool.on{background:var(--selected-bg);border-color:var(--red);color:#fff;animation:pop .28s var(--ease-spring)}
.swatch{width:20px;height:20px;border-radius:5px;border:2px solid transparent;cursor:pointer;margin:0 1px;padding:0}
.swatch:hover{transform:translateY(-1px)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--red);animation:pop .28s var(--ease-spring)}
.ann-text{position:fixed;min-width:40px;padding:3px 5px;border:1px dashed currentColor;border-radius:3px;font:700 22px/1.25 "Segoe UI",system-ui,sans-serif;outline:none;white-space:pre;cursor:text;background:rgba(0,0,0,.08)}
.hint .cam{color:var(--red);font-weight:700}
</style></head>
<body>
<img id="shot" alt="">
<canvas id="dim"></canvas>
<canvas id="ann"></canvas>
<div class="sel" id="sel"><i class="h nw" data-h="nw"></i><i class="h n" data-h="n"></i><i class="h ne" data-h="ne"></i><i class="h e" data-h="e"></i><i class="h se" data-h="se"></i><i class="h s" data-h="s"></i><i class="h sw" data-h="sw"></i><i class="h w" data-h="w"></i></div>
<div class="tag" id="tag"></div>
<div class="hint" id="hint">Kéo để chọn vùng · Bấm 1 lần để chọn cả màn hình · <kbd>Enter</kbd> quay · <kbd>Esc</kbd> huỷ</div>
<div class="bar" id="bar">
  <button class="btn pri" id="go" title="Bắt đầu quay (Enter)" data-i="play">Quay <kbd>Enter</kbd></button>
  <span class="div"></span>
  <button class="chip" data-p="last" id="pLast" title="Dùng lại vùng đã chọn lần trước" hidden>Vùng trước</button>
  <button class="chip" data-p="1280x720" title="Đặt vùng 1280×720">1280×720</button>
  <button class="chip" data-p="1920x1080" title="Đặt vùng 1920×1080">1920×1080</button>
  <button class="chip" data-p="square" title="Vùng vuông">Vuông</button>
  <span class="div"></span>
  <button class="ibtn" id="tCursor" title="Quay kèm con trỏ chuột"></button>
  <button class="ibtn" id="tAudio" title="Thu âm thanh máy"></button>
  <button class="ibtn" id="cancel" title="Huỷ (Esc)" data-i="x"></button>
</div>
<div class="bar" id="shotbar">
  <button class="tool" data-tool="arrow" title="Mũi tên (A)" data-i="arrow"></button>
  <button class="tool" data-tool="rect" title="Khung (R) · giữ Shift = vuông" data-i="rect"></button>
  <button class="tool" data-tool="text" title="Chữ (T)" data-i="text"></button>
  <button class="tool" data-tool="pen" title="Bút vẽ (P)" data-i="pen"></button>
  <button class="tool" data-tool="hl" title="Bút tô sáng (H)" data-i="hl"></button>
  <button class="tool" data-tool="blur" title="Làm mờ (B)" data-i="blur"></button>
  <span class="div"></span>
  <span id="swatches"></span>
  <span class="div"></span>
  <button class="tool" id="undo" title="Hoàn tác (Ctrl+Z)" data-i="undo"></button>
  <button class="tool" id="shotCancel" title="Huỷ (Esc)" data-i="x"></button>
  <span class="div"></span>
  <button class="btn" id="saveBtn" title="Lưu ảnh PNG + copy (Ctrl+S)" data-i="save">Lưu</button>
  <button class="btn pri" id="copyBtn" title="Copy ảnh (Enter / Ctrl+C)" data-i="copy">Copy <kbd>Enter</kbd></button>
</div>
<div class="loupe" id="loupe"><canvas id="lc" width="120" height="120"></canvas><span id="lpos"></span></div>
<script src="icons.js"></script>
<script src="annotate.js"></script>
<script src="overlay.js"></script>
</body></html>
